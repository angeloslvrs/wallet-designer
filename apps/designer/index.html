<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boarding Pass Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app-shell">
      <header id="masthead">
        <div class="wpd-masthead-brand">Boarding Pass Studio</div>
        <nav id="view-tabs">
          <button data-view="designer">Design</button>
          <button data-view="issue" class="active">Issue</button>
          <button data-view="manage">Manage</button>
        </nav>
        <span id="profile-badge">…</span>
      </header>

      <div id="app-main">
        <main hidden>
          <section id="form-pane"></section>
          <section id="preview-pane">
            <nav id="tabs">
              <button data-tab="front" class="active">Front</button>
              <button data-tab="back">Back</button>
              <button data-tab="detail">iOS 26 detail</button>
            </nav>
            <div id="preview-stage"></div>
            <div id="preview-caption">Pass preview is Apple-faithful — not skinned</div>
            <div id="actions">
              <select id="fixture-picker"><option value="">Load saved design…</option></select>
              <button id="build-btn">Build .pkpass</button>
              <button id="save-tpl-btn" type="button">Save design</button>
              <button id="reset-btn" type="button">Reset</button>
            </div>
            <div id="build-status"></div>
          </section>
        </main>
        <section id="manage-pane" hidden></section>
        <section id="issue-pane"></section>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
