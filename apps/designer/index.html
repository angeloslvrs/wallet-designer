<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Content-Security-Policy. This meta tag ships in both dev and prod (Vite
         copies index.html verbatim), so the policy must satisfy both.
         - default-src 'self': everything is same-origin (SPA ↔ API) by default,
           and this also covers scripts (only same-origin module scripts load).
         - img-src adds data: (branding PNG data-URL uploads + previews) and
           blob: (zxing decodes an uploaded photo via a blob: object URL).
         - style-src adds 'unsafe-inline' (many inline style="" attrs + styles
           Vite injects at runtime) and the Google Fonts stylesheet host.
         - font-src adds the Google Fonts file host (fonts.gstatic.com).
         - connect-src adds ws:/wss: for Vite's dev HMR socket (API is 'self'). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws: wss:"
    />
    <title>Boarding Pass Studio</title>
    <link rel="icon" href="data:," />
    <meta name="color-scheme" content="dark light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles.css" />
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="app-shell">
      <header id="masthead">
        <div class="wpd-masthead-brand">Boarding Pass Studio</div>
        <nav id="view-tabs" class="seg" aria-label="Views">
          <span class="seg-thumb" aria-hidden="true"></span>
          <button type="button" data-view="flights" class="active">Flights</button>
          <button type="button" data-view="templates">Templates</button>
          <button type="button" data-view="log">Device log</button>
        </nav>
        <div class="masthead-right">
          <span id="profile-badge">…</span>
          <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle light / dark theme">☀</button>
        </div>
      </header>

      <div id="app-main">
        <section id="flights-pane"></section>
        <section id="templates-pane" hidden></section>
        <main hidden>
          <header class="iw-bar">
            <button type="button" class="btn btn-sm" data-design-act="back">‹ Templates</button>
            <div class="iw-title"><b id="design-title">New design</b><small id="design-sub">Studio design</small></div>
            <nav aria-label="Design sections"><div id="design-tabs" class="iw-tabs dw-tabs" role="tablist"></div></nav>
          </header>
          <div class="dw-ws">
            <section id="form-pane" class="dw-left"></section>
            <section id="preview-pane" class="iw-canvas">
              <nav id="tabs" class="iw-tabs iw-tabs--center" role="tablist" aria-label="Pass side">
                <button type="button" role="tab" class="iw-tab active" data-tab="front" aria-selected="true">Front</button>
                <button type="button" role="tab" class="iw-tab" data-tab="back" aria-selected="false">Back</button>
                <button type="button" role="tab" class="iw-tab" data-tab="detail" aria-selected="false">iOS 26 detail</button>
              </nav>
              <div id="preview-stage"></div>
              <p id="preview-caption">Click a field on the pass to edit it. The preview is Apple-faithful.</p>
            </section>
            <aside id="design-side" class="dw-right"></aside>
          </div>
          <footer class="iw-foot">
            <span class="iw-ready" id="build-status" role="status" aria-live="polite"></span>
            <div class="iw-foot-acts">
              <button type="button" class="btn" data-design-act="reset">Start over</button>
              <label class="dw-name"><span class="sr-only">Template name</span><input id="design-name" class="iw-input mono" placeholder="template-name" autocomplete="off" spellcheck="false" /></label>
              <button type="button" class="btn" data-design-act="issue">Issue passes →</button>
              <button type="button" class="btn btn-primary" data-design-act="save">Save template</button>
            </div>
          </footer>
        </main>
        <section id="issue-pane" hidden></section>
        <section id="log-pane" hidden></section>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
